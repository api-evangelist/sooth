aid: sooth
name: Sooth
description: >-
  Sooth (Sooth Labs, Inc.) is an AI research company building a "World Model for
  Global Foresight" — a continuously trained forecasting engine that integrates
  economic, geopolitical, and operational signals into calibrated probability
  forecasts for high-stakes decisions. Its platform is described in three parts:
  the Sooth Engine (a world model that reasons across domains), Sooth Chronology
  (autonomous agents that collect and prioritize signals), and Sooth Proof
  (cryptographically committed, calibrated forecasts with an auditable track
  record). Founded by veterans of frontier AI at Meta and Carnegie Mellon and
  backed by Felicis, the company is pre-product as of mid-2026 and does not yet
  publish a public API, developer portal, or documentation.
